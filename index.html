<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Ruleta de Accesorios - Santa Clara Pickup</title>

<link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   COLORES
========================================================= */

:root{
    --rojo:#E60012;
    --verde:#74B950;
    --negro:#171717;
    --negro-ruleta:#252525;
    --blanco:#FFFFFF;
    --gris:#F4F4F4;
}


/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;
}


/* =========================================================
   BODY - TÓTEM VERTICAL
========================================================= */

body{

    width:100vw;

    height:100vh;
    height:100dvh;

    background-image:url("fondo.png");
    background-repeat:no-repeat;
    background-position:center center;
    background-size:cover;

    background-color:#f4f4f4;

    font-family:'Oswald', sans-serif;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;

    padding:
        clamp(10px,1.3dvh,25px)
        clamp(10px,2vw,30px)
        clamp(15px,1.5dvh,30px);

    overflow:hidden;
}


/* =========================================================
   LOGO SUPERIOR
========================================================= */

.logo-top{

    width:min(50vw,370px);

    max-height:7dvh;

    height:auto;

    display:block;

    object-fit:contain;

    margin:
        0
        auto
        clamp(5px,.7dvh,14px);

    flex-shrink:0;
}


/* =========================================================
   TÍTULO
========================================================= */

.main-title{

    font-family:'Bebas Neue', sans-serif;

    font-size:
        clamp(
            48px,
            min(8.2vw,7.4dvh),
            105px
        );

    line-height:.86;

    text-align:center;

    letter-spacing:1px;

    font-weight:400;

    margin:
        0
        auto
        clamp(18px,2dvh,34px);

    flex-shrink:0;
}


/* RULETA DE */

.title-black{
    color:var(--negro);
}


/* ACCESORIOS */

.title-green{
    color:var(--rojo);
}


/* =========================================================
   CONTENEDOR RULETA
========================================================= */

.wheel-wrapper{

    width:100%;

    display:flex;

    justify-content:center;
    align-items:center;

    margin:
        0
        auto
        clamp(14px,1.8dvh,30px);

    flex-shrink:0;
}


/* =========================================================
   RULETA
========================================================= */

.wheel-container{

    position:relative;

    /*
       CENTRADO ABSOLUTO HORIZONTAL
    */

    margin-left:auto;
    margin-right:auto;

    /*
       TAMAÑO ADAPTABLE AL TÓTEM
    */

    width:
        min(
            76vw,
            46dvh,
            760px
        );

    aspect-ratio:1 / 1;

    border-radius:50%;

    overflow:visible;

    flex-shrink:0;
}


/* =========================================================
   ARO EXTERIOR
========================================================= */

.wheel-container::before{

    content:"";

    position:absolute;

    inset:-3%;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #303030 0%,
            #111111 35%,
            #252525 55%,
            #080808 80%,
            #292929 100%
        );

    box-shadow:
        0 12px 25px rgba(0,0,0,.28),
        inset 0 2px 5px rgba(255,255,255,.15);

    z-index:-2;
}


/* =========================================================
   ARO ROJO
========================================================= */

.wheel-container::after{

    content:"";

    position:absolute;

    inset:1%;

    border-radius:50%;

    border:
        clamp(
            5px,
            .7vw,
            9px
        )
        solid
        var(--rojo);

    box-shadow:
        inset 0 0 0 3px #670006,
        0 0 12px rgba(230,0,18,.40);

    pointer-events:none;

    z-index:2;
}


/* =========================================================
   CANVAS
========================================================= */

canvas{

    width:100%;

    height:100%;

    display:block;

    border-radius:50%;

    filter:
        drop-shadow(
            0 10px 16px
            rgba(0,0,0,.25)
        );
}


/* =========================================================
   FLECHA NEGRA
========================================================= */

.pointer{

    position:absolute;

    top:-36px;

    left:50%;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:
        clamp(18px,2.5vw,30px)
        solid transparent;

    border-right:
        clamp(18px,2.5vw,30px)
        solid transparent;

    border-top:
        clamp(38px,4.2vw,58px)
        solid #171717;

    z-index:10;

    filter:
        drop-shadow(
            0 4px 3px
            rgba(0,0,0,.25)
        );
}


/* =========================================================
   LUCES
========================================================= */

.lights{

    position:absolute;

    inset:0;

    border-radius:50%;

    pointer-events:none;

    z-index:5;
}


.light{

    position:absolute;

    width:2.4%;

    aspect-ratio:1 / 1;

    background:#ffffff;

    border-radius:50%;

    box-shadow:
        0 0 6px #ffffff,
        0 0 12px #ffffff,
        0 0 18px #ff2020;

    animation:blink 1s infinite alternate;
}


@keyframes blink{

    from{

        opacity:.45;

        transform:
            translate(-50%,-50%)
            scale(.85);
    }

    to{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1);
    }
}


/* =========================================================
   BOTÓN CENTRAL
========================================================= */

.center-button{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:18%;

    aspect-ratio:1 / 1;

    border-radius:50%;

    border:
        clamp(3px,.4vw,5px)
        solid
        var(--verde);

    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #f4f4f4 68%,
            #d6d6d6 100%
        );

    display:flex;

    align-items:center;
    justify-content:center;

    padding:clamp(5px,.8vw,10px);

    cursor:pointer;

    z-index:20;

    box-shadow:
        0 4px 10px rgba(0,0,0,.28),
        0 0 0 2px rgba(255,255,255,.8),
        inset 0 2px 4px rgba(255,255,255,.8);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        filter .25s ease;
}


/* MOVIMIENTO AL PASAR MOUSE */

.center-button:hover{

    transform:
        translate(-50%,-50%)
        scale(1.11);

    box-shadow:
        0 8px 18px rgba(0,0,0,.32),
        0 0 16px rgba(116,185,80,.55),
        inset 0 2px 5px rgba(255,255,255,.9);

    filter:brightness(1.05);
}


.center-button:active{

    transform:
        translate(-50%,-50%)
        scale(.94);
}


.center-button.disabled{

    pointer-events:none;

    opacity:.90;
}


/* =========================================================
   LOGO CENTRAL
========================================================= */

.center-logo{

    width:78%;

    height:78%;

    object-fit:contain;

    display:block;

    pointer-events:none;

    transition:transform .25s ease;
}


.center-button:hover .center-logo{

    transform:scale(1.05);
}


/* =========================================================
   TEXTO INFERIOR
========================================================= */

.bottom-text{

    width:100%;

    text-align:center;

    margin-top:
        clamp(
            20px,
            2.2dvh,
            38px
        );

    margin-bottom:
        clamp(
            24px,
            2.8dvh,
            48px
        );

    flex-shrink:0;
}


.bottom-text h2{

    font-family:'Oswald', sans-serif;

    font-size:
        clamp(
            24px,
            min(4.6vw,3.5dvh),
            50px
        );

    line-height:1;

    font-weight:700;

    margin:0;

    letter-spacing:.3px;
}


.text-black{
    color:var(--negro);
}


.text-green{
    color:var(--verde);
}


/* =========================================================
   LOGO INFERIOR - SANTA CLARA
========================================================= */

.logo-bottom{

    width:
        min(
            58vw,
            450px
        );

    max-height:8dvh;

    height:auto;

    display:block;

    object-fit:contain;

    /*
       SEPARACIÓN EXTRA
    */

    margin:
        clamp(
            8px,
            1dvh,
            20px
        )
        auto
        0;

    flex-shrink:0;
}


/* =========================================================
   POPUP
========================================================= */

.popup-overlay{

    position:fixed;

    inset:0;

    width:100%;

    height:100vh;
    height:100dvh;

    background:rgba(0,0,0,.78);

    display:flex;

    justify-content:center;
    align-items:center;

    padding:20px;

    z-index:9999;
}


/* =========================================================
   CAJA POPUP
========================================================= */

.popup-box{

    position:relative;

    width:min(86vw,540px);

    max-height:88dvh;

    background:#ffffff;

    padding:
        clamp(25px,3dvh,45px)
        clamp(20px,3vw,35px);

    border-radius:
        clamp(15px,2vw,24px);

    text-align:center;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.45);

    animation:popupScale .3s ease;

    overflow-y:auto;
}


@keyframes popupScale{

    from{
        transform:scale(.7);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}


/* =========================================================
   TEXTO SUPERIOR POPUP
========================================================= */

.popup-label{

    font-family:'Oswald', sans-serif;

    font-size:
        clamp(
            18px,
            2.5vw,
            26px
        );

    font-weight:600;

    color:#555555;

    letter-spacing:1px;

    margin:0 0 6px;
}


/* =========================================================
   NOMBRE PREMIO
========================================================= */

.popup-title{

    font-family:'Bebas Neue', sans-serif;

    font-size:
        clamp(
            44px,
            7vw,
            78px
        );

    line-height:.9;

    color:#E60012;

    margin:
        0
        0
        clamp(12px,1.5dvh,20px);
}


/* =========================================================
   IMAGEN PREMIO
========================================================= */

.popup-image{

    width:min(65vw,340px);

    max-height:30dvh;

    object-fit:contain;

    display:block;

    margin:
        clamp(8px,1dvh,15px)
        auto
        clamp(14px,2dvh,25px);

    border-radius:10px;
}


/* =========================================================
   BOTÓN CERRAR
========================================================= */

.popup-btn{

    margin-top:
        clamp(
            12px,
            1.5dvh,
            24px
        );

    padding:
        clamp(11px,1.3dvh,17px)
        clamp(30px,5vw,50px);

    border:none;

    border-radius:
        clamp(7px,1vw,12px);

    background:var(--verde);

    color:#ffffff;

    font-family:'Oswald', sans-serif;

    font-size:
        clamp(
            19px,
            2.5vw,
            27px
        );

    font-weight:600;

    cursor:pointer;

    box-shadow:
        0 5px 12px
        rgba(0,0,0,.20);

    transition:
        transform .2s ease,
        filter .2s ease,
        box-shadow .2s ease;
}


.popup-btn:hover{

    filter:brightness(.90);

    transform:scale(1.05);

    box-shadow:
        0 7px 16px
        rgba(0,0,0,.25);
}


.popup-btn:active{

    transform:scale(.96);
}


/* =========================================================
   TÓTEM VERTICAL ANGOSTO
========================================================= */

@media(max-width:800px){

    body{

        padding:
            10px
            10px
            15px;
    }


    .logo-top{

        width:min(52vw,320px);

        max-height:6.5dvh;
    }


    .main-title{

        font-size:
            clamp(
                44px,
                min(10vw,7dvh),
                82px
            );

        margin-bottom:
            clamp(
                15px,
                1.8dvh,
                26px
            );
    }


    .wheel-container{

        width:
            min(
                80vw,
                45dvh,
                650px
            );
    }


    .bottom-text{

        margin-top:
            clamp(
                20px,
                2dvh,
                30px
            );

        margin-bottom:
            clamp(
                25px,
                2.8dvh,
                40px
            );
    }


    .bottom-text h2{

        font-size:
            clamp(
                22px,
                min(5vw,3.3dvh),
                40px
            );
    }


    .logo-bottom{

        width:min(62vw,380px);

        max-height:7.5dvh;
    }
}


/* =========================================================
   PANTALLAS CON MENOR ALTURA
========================================================= */

@media(max-height:1300px){

    .logo-top{

        max-height:6dvh;
    }


    .main-title{

        font-size:
            clamp(
                42px,
                6.8dvh,
                72px
            );

        margin-bottom:12px;
    }


    .wheel-container{

        width:
            min(
                76vw,
                43dvh,
                620px
            );
    }


    .bottom-text{

        margin-top:18px;

        margin-bottom:24px;
    }


    .bottom-text h2{

        font-size:
            clamp(
                21px,
                3dvh,
                36px
            );
    }


    .logo-bottom{

        max-height:7dvh;

        margin-top:8px;
    }
}

</style>

</head>


<body>


<!-- =========================================================
     LOGO SUPERIOR
========================================================= -->

<img
    src="logo-superior.png"
    class="logo-top"
    alt="Isuzu Pickup"
>


<!-- =========================================================
     TÍTULO
========================================================= -->

<h1 class="main-title">

    <span class="title-black">
        RULETA DE
    </span>

    <br>

    <span class="title-green">
        ACCESORIOS
    </span>

</h1>


<!-- =========================================================
     RULETA
========================================================= -->

<div class="wheel-wrapper">

    <div class="wheel-container">

        <div class="pointer"></div>

        <canvas id="wheel"></canvas>

        <div class="lights"></div>


        <!-- BOTÓN CENTRAL -->

        <div
            id="centerButton"
            class="center-button"
            onclick="spin()"
        >

            <img
                src="logo-centro.png"
                class="center-logo"
                alt="Santa Clara Pickup"
            >

        </div>

    </div>

</div>


<!-- =========================================================
     TEXTO INFERIOR
========================================================= -->

<div class="bottom-text">

    <h2>

        <span class="text-black">
            ¡EQUIPA TU ISUZU
        </span>

        <span class="text-black">
            Y GANA!
        </span>

    </h2>

</div>


<!-- =========================================================
     LOGO INFERIOR
========================================================= -->

<img
    src="logo-inferior.png"
    class="logo-bottom"
    alt="Santa Clara Pickup"
>


<script>


/* =========================================================
   PREMIOS
========================================================= */

const prizes = [

    {
        name:"POLERA ISUZU PICKUP",
        image:"premio1.png",
        message:"¡FELICITACIONES! GANASTE:"
    },

    {
        name:"INTENTA DE NUEVO",
        image:"intenta.png",
        message:"¡SIGUE PARTICIPANDO!"
    },

    {
        name:"POLO ISUZU PICKUP",
        image:"premio2.png",
        message:"¡FELICITACIONES! GANASTE:"
    },

    {
        name:"INTENTA DE NUEVO",
        image:"intenta.png",
        message:"¡SIGUE PARTICIPANDO!"
    },

    {
        name:"GORRA ISUZU PICKUP",
        image:"premio3.png",
        message:"¡FELICITACIONES! GANASTE:"
    },

    {
        name:"INTENTA DE NUEVO",
        image:"intenta.png",
        message:"¡SIGUE PARTICIPANDO!"
    },

    {
        name:"TERMOMETRO DIGITAL",
        image:"premio4.png",
        message:"¡FELICITACIONES! GANASTE:"
    },

    {
        name:"INTENTA DE NUEVO",
        image:"intenta.png",
        message:"¡SIGUE PARTICIPANDO!"
    }

];


/* =========================================================
   ELEMENTOS
========================================================= */

const canvas =
    document.getElementById("wheel");


const container =
    document.querySelector(".wheel-container");


const ctx =
    canvas.getContext("2d");


const centerButton =
    document.getElementById("centerButton");


/* =========================================================
   VARIABLES
========================================================= */

let angle = 0;

let spinning = false;


/* =========================================================
   SONIDOS
========================================================= */

const spinSound =
    new Audio("ruleta.mp3");


const winSound =
    new Audio("ganador.mp3");


const loseSound =
    new Audio("intenta.mp3");


/* =========================================================
   RESIZE CANVAS
========================================================= */

function resizeCanvas(){

    const size =
        container.offsetWidth;


    const pixelRatio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        size * pixelRatio;


    canvas.height =
        size * pixelRatio;


    canvas.style.width =
        size + "px";


    canvas.style.height =
        size + "px";


    ctx.setTransform(
        pixelRatio,
        0,
        0,
        pixelRatio,
        0,
        0
    );
}


/* =========================================================
   DIBUJAR REGALO
========================================================= */

function drawGiftIcon(
    ctx,
    x,
    y,
    size,
    boxColor,
    ribbonColor
){

    ctx.save();

    ctx.translate(x,y);


    const boxW =
        size * 0.60;

    const boxH =
        size * 0.43;

    const lidW =
        size * 0.70;

    const lidH =
        size * 0.13;

    const ribbonW =
        size * 0.10;

    const ribbonH =
        size * 0.075;

    const topY =
        -size * 0.015;


    /* CAJA */

    ctx.fillStyle =
        boxColor;


    ctx.beginPath();


    ctx.roundRect(
        -boxW / 2,
        topY,
        boxW,
        boxH,
        size * 0.035
    );


    ctx.fill();


    /* TAPA */

    ctx.beginPath();


    ctx.roundRect(
        -lidW / 2,
        topY - lidH,
        lidW,
        lidH,
        size * 0.03
    );


    ctx.fill();


    /* CINTA VERTICAL */

    ctx.fillStyle =
        ribbonColor;


    ctx.fillRect(
        -ribbonW / 2,
        topY - lidH,
        ribbonW,
        boxH + lidH
    );


    /* CINTA HORIZONTAL */

    ctx.fillRect(
        -boxW / 2,
        topY + boxH * 0.36,
        boxW,
        ribbonH
    );


    /* LAZO */

    ctx.strokeStyle =
        ribbonColor;


    ctx.lineWidth =
        size * 0.055;


    ctx.lineCap =
        "round";


    ctx.lineJoin =
        "round";


    /* IZQUIERDO */

    ctx.beginPath();


    ctx.moveTo(
        0,
        topY - lidH
    );


    ctx.bezierCurveTo(

        -size * 0.05,
        -size * 0.29,

        -size * 0.28,
        -size * 0.31,

        -size * 0.21,
        -size * 0.105

    );


    ctx.bezierCurveTo(

        -size * 0.12,
        -size * 0.025,

        -size * 0.04,
        -size * 0.05,

        0,
        topY - lidH

    );


    ctx.stroke();


    /* DERECHO */

    ctx.beginPath();


    ctx.moveTo(
        0,
        topY - lidH
    );


    ctx.bezierCurveTo(

        size * 0.05,
        -size * 0.29,

        size * 0.28,
        -size * 0.31,

        size * 0.21,
        -size * 0.105

    );


    ctx.bezierCurveTo(

        size * 0.12,
        -size * 0.025,

        size * 0.04,
        -size * 0.05,

        0,
        topY - lidH

    );


    ctx.stroke();


    /* NUDO */

    ctx.fillStyle =
        ribbonColor;


    ctx.beginPath();


    ctx.arc(
        0,
        topY - lidH,
        size * 0.055,
        0,
        Math.PI * 2
    );


    ctx.fill();


    ctx.restore();
}


/* =========================================================
   DIBUJAR RULETA
========================================================= */

function drawWheel(){

    const size =
        container.offsetWidth;


    const center =
        size / 2;


    const radius =
        center - 15;


    const sliceAngle =
        (2 * Math.PI) /
        prizes.length;


    ctx.clearRect(
        0,
        0,
        size,
        size
    );


    for(
        let i = 0;
        i < prizes.length;
        i++
    ){

        /* SEGMENTO */

        ctx.beginPath();


        ctx.moveTo(
            center,
            center
        );


        ctx.arc(

            center,
            center,
            radius,

            angle +
            i * sliceAngle,

            angle +
            (i + 1) * sliceAngle

        );


        ctx.closePath();


        /* COLORES */

        if(i % 3 === 0){

            ctx.fillStyle =
                "#E60012";

        }

        else if(i % 3 === 1){

            ctx.fillStyle =
                "#252525";

        }

        else{

            ctx.fillStyle =
                "#F4F4F4";

        }


        ctx.fill();


        ctx.lineWidth =
            3;


        ctx.strokeStyle =
            "#FFFFFF";


        ctx.stroke();


        /* CONTENIDO */

        ctx.save();


        ctx.translate(
            center,
            center
        );


        ctx.rotate(

            angle +
            i * sliceAngle +
            sliceAngle / 2

        );


        /* INTENTA DE NUEVO */

        if(
            prizes[i].name ===
            "INTENTA DE NUEVO"
        ){

            if(i % 3 === 2){

                ctx.fillStyle =
                    "#171717";

            }

            else{

                ctx.fillStyle =
                    "#FFFFFF";

            }


            ctx.textAlign =
                "center";


            ctx.textBaseline =
                "middle";


            ctx.font =
                "700 " +
                (size * 0.042) +
                "px Oswald";


            const textX =
                radius * 0.67;


            const lineHeight =
                size * 0.052;


            ctx.fillText(
                "INTENTA",
                textX,
                -lineHeight / 2
            );


            ctx.fillText(
                "DE NUEVO",
                textX,
                lineHeight / 2
            );

        }

        else{

            /* REGALO */

            let boxColor;

            let ribbonColor;


            /* NEGRO */

            if(i % 3 === 1){

                boxColor =
                    "#FFFFFF";

                ribbonColor =
                    "#E60012";

            }


            /* ROJO */

            else if(i % 3 === 0){

                boxColor =
                    "#FFFFFF";

                ribbonColor =
                    "#171717";

            }


            /* BLANCO */

            else{

                boxColor =
                    "#171717";

                ribbonColor =
                    "#E60012";

            }


            drawGiftIcon(

                ctx,

                radius * 0.67,

                0,

                size * 0.17,

                boxColor,

                ribbonColor

            );

        }


        ctx.restore();

    }


    /* BORDE */

    ctx.beginPath();


    ctx.arc(
        center,
        center,
        radius,
        0,
        2 * Math.PI
    );


    ctx.lineWidth =
        7;


    ctx.strokeStyle =
        "#171717";


    ctx.stroke();
}


/* =========================================================
   GIRAR
========================================================= */

function spin(){

    if(spinning)
        return;


    spinning =
        true;


    centerButton
        .classList
        .add("disabled");


    spinSound.currentTime =
        0;


    spinSound
        .play()
        .catch(() => {});


    const spinDuration =
        4000;


    const startAngle =
        angle;


    const extraSpins =
        6 * 2 * Math.PI;


    const randomAngle =
        Math.random() *
        2 *
        Math.PI;


    const finalAngle =
        startAngle +
        extraSpins +
        randomAngle;


    let start =
        null;


    function animate(timestamp){

        if(!start){

            start =
                timestamp;

        }


        const progress =
            timestamp -
            start;


        const normalized =
            Math.min(
                progress /
                spinDuration,
                1
            );


        const ease =
            1 -
            Math.pow(
                1 - normalized,
                3
            );


        angle =
            startAngle +
            ease *
            (
                finalAngle -
                startAngle
            );


        drawWheel();


        if(
            progress <
            spinDuration
        ){

            requestAnimationFrame(
                animate
            );

        }

        else{

            angle =
                finalAngle %
                (2 * Math.PI);


            drawWheel();


            spinning =
                false;


            centerButton
                .classList
                .remove("disabled");


            spinSound.pause();


            showResult();

        }

    }


    requestAnimationFrame(
        animate
    );
}


/* =========================================================
   RESULTADO
========================================================= */

function showResult(){

    const sliceAngle =
        (2 * Math.PI) /
        prizes.length;


    const adjustedAngle =
        (
            angle +
            Math.PI / 2
        )
        %
        (2 * Math.PI);


    const index =
        prizes.length -
        Math.floor(
            adjustedAngle /
            sliceAngle
        )
        -
        1;


    const finalIndex =
        (
            index +
            prizes.length
        )
        %
        prizes.length;


    const prize =
        prizes[finalIndex];


    if(
        prize.name ===
        "INTENTA DE NUEVO"
    ){

        loseSound.currentTime =
            0;


        loseSound
            .play()
            .catch(() => {});

    }

    else{

        winSound.currentTime =
            0;


        winSound
            .play()
            .catch(() => {});

    }


    showPopup(prize);
}


/* =========================================================
   POPUP
========================================================= */

function showPopup(prize){

    const popup =
        document.createElement(
            "div"
        );


    popup.className =
        "popup-overlay";


    popup.innerHTML = `

        <div class="popup-box">

            <p class="popup-label">
                ${prize.message}
            </p>


            <h2 class="popup-title">
                ${prize.name}
            </h2>


            <img
                src="${prize.image}"
                class="popup-image"
                alt="${prize.name}"
                onerror="
                    this.style.display='none';
                "
            >


            <button
                class="popup-btn"
                onclick="
                    this
                    .parentElement
                    .parentElement
                    .remove()
                "
            >

                CERRAR

            </button>

        </div>

    `;


    document.body
        .appendChild(
            popup
        );
}


/* =========================================================
   LUCES
========================================================= */

function createLights(){

    const lightsContainer =
        document.querySelector(
            ".lights"
        );


    lightsContainer.innerHTML =
        "";


    const size =
        container.offsetWidth;


    const center =
        size / 2;


    const radius =
        center * 0.97;


    const total =
        36;


    for(
        let i = 0;
        i < total;
        i++
    ){

        const lightAngle =
            (
                i /
                total
            )
            *
            (2 * Math.PI);


        const x =
            center +
            radius *
            Math.cos(
                lightAngle
            );


        const y =
            center +
            radius *
            Math.sin(
                lightAngle
            );


        const light =
            document.createElement(
                "div"
            );


        light.classList.add(
            "light"
        );


        light.style.left =
            (
                x /
                size *
                100
            )
            +
            "%";


        light.style.top =
            (
                y /
                size *
                100
            )
            +
            "%";


        light.style.animationDelay =
            (
                i * 0.05
            )
            +
            "s";


        lightsContainer
            .appendChild(
                light
            );

    }
}


/* =========================================================
   RESIZE
========================================================= */

let resizeTimer;


window.addEventListener(
    "resize",
    () => {

        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                () => {

                    resizeCanvas();

                    drawWheel();

                    createLights();

                },
                100
            );

    }
);


/* =========================================================
   CARGAR
========================================================= */

window.addEventListener(
    "load",
    () => {

        resizeCanvas();

        drawWheel();

        createLights();

    }
);

</script>
