<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Ruleta de Accesorios - Santa Clara Pickup</title>

<link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   COLORES
========================================================= */

:root{
    --rojo:#E60012;
    --verde:#74B950;
    --negro:#171717;
    --negro-ruleta:#252525;
    --blanco:#FFFFFF;
    --gris:#F4F4F4;
}


/* =========================================================
   GENERAL
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{

    background-image:url("fondo.png");

    background-repeat:no-repeat;

    background-position:center center;

    background-size:cover;

    background-attachment:fixed;

    background-color:#f4f4f4;

    font-family:'Oswald', sans-serif;

    display:flex;

    flex-direction:column;

    align-items:center;

    min-height:100vh;

    padding:22px 15px 25px;

    overflow-x:hidden;
}


/* =========================================================
   LOGO SUPERIOR
========================================================= */

.logo-top{

    width:min(65vw,280px);

    height:auto;

    display:block;

    object-fit:contain;

    margin:5px 0 12px;

    flex-shrink:0;
}


/* =========================================================
   TÍTULO
========================================================= */

.main-title{

    font-family:'Bebas Neue', sans-serif;

    font-size:clamp(52px,9vw,82px);

    line-height:.88;

    text-align:center;

    letter-spacing:1px;

    margin:0 0 25px;

    font-weight:400;
}


.title-black{
    color:var(--negro);
}


.title-green{
    color:var(--rojo);
}


/* =========================================================
   CONTENEDOR RULETA
========================================================= */

.wheel-wrapper{

    width:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    margin:5px 0 20px;
}


/* =========================================================
   RULETA
========================================================= */

.wheel-container{

    position:relative;

    width:min(78vw,500px);

    aspect-ratio:1 / 1;

    border-radius:50%;

    overflow:visible;
}


/* =========================================================
   ARO EXTERIOR
========================================================= */

.wheel-container::before{

    content:"";

    position:absolute;

    inset:-3%;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #303030 0%,
            #111111 35%,
            #252525 55%,
            #080808 80%,
            #292929 100%
        );

    box-shadow:
        0 12px 25px rgba(0,0,0,.28),
        inset 0 2px 5px rgba(255,255,255,.15);

    z-index:-2;
}


/* =========================================================
   ARO ROJO
========================================================= */

.wheel-container::after{

    content:"";

    position:absolute;

    inset:1%;

    border-radius:50%;

    border:8px solid var(--rojo);

    box-shadow:
        inset 0 0 0 3px #670006,
        0 0 12px rgba(230,0,18,.40);

    pointer-events:none;

    z-index:2;
}


/* =========================================================
   CANVAS
========================================================= */

canvas{

    width:100%;

    height:100%;

    display:block;

    border-radius:50%;

    filter:
        drop-shadow(
            0 10px 16px
            rgba(0,0,0,.25)
        );
}


/* =========================================================
   FLECHA
========================================================= */

.pointer{

    position:absolute;

    top:-36px;

    left:50%;

    transform:translateX(-50%);

    width:0;

    height:0;

    border-left:25px solid transparent;

    border-right:25px solid transparent;

    border-top:50px solid #E60012;

    z-index:10;

    filter:
        drop-shadow(
            0 4px 3px
            rgba(0,0,0,.25)
        );
}


/* =========================================================
   LUCES
========================================================= */

.lights{

    position:absolute;

    inset:0;

    border-radius:50%;

    pointer-events:none;

    z-index:5;
}


.light{

    position:absolute;

    width:2.4%;

    aspect-ratio:1 / 1;

    background:#ffffff;

    border-radius:50%;

    box-shadow:
        0 0 6px #ffffff,
        0 0 12px #ffffff,
        0 0 18px #ff2020;

    animation:blink 1s infinite alternate;
}


@keyframes blink{

    from{

        opacity:.45;

        transform:
            translate(-50%,-50%)
            scale(.85);
    }

    to{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1);
    }
}


/* =========================================================
   BOTÓN CENTRAL
========================================================= */

.center-button{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:18%;

    aspect-ratio:1 / 1;

    border-radius:50%;

    border:4px solid var(--verde);

    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #f4f4f4 68%,
            #d6d6d6 100%
        );

    display:flex;

    align-items:center;

    justify-content:center;

    padding:8px;

    cursor:pointer;

    z-index:20;

    box-shadow:
        0 4px 10px rgba(0,0,0,.28),
        0 0 0 2px rgba(255,255,255,.8),
        inset 0 2px 4px rgba(255,255,255,.8);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        filter .25s ease;
}


.center-button:hover{

    transform:
        translate(-50%,-50%)
        scale(1.11);

    box-shadow:
        0 8px 18px rgba(0,0,0,.32),
        0 0 16px rgba(116,185,80,.55),
        inset 0 2px 5px rgba(255,255,255,.9);

    filter:brightness(1.05);
}


.center-button:active{

    transform:
        translate(-50%,-50%)
        scale(.94);
}


.center-button.disabled{

    pointer-events:none;

    opacity:.90;
}


/* =========================================================
   LOGO CENTRAL
========================================================= */

.center-logo{

    width:78%;

    height:78%;

    object-fit:contain;

    display:block;

    pointer-events:none;

    transition:transform .25s ease;
}


.center-button:hover .center-logo{

    transform:scale(1.05);
}


/* =========================================================
   TEXTO INFERIOR
========================================================= */

.bottom-text{

    text-align:center;

    margin-top:12px;

    margin-bottom:22px;
}


.bottom-text h2{

    font-family:'Oswald', sans-serif;

    font-size:
        clamp(
            24px,
            5vw,
            38px
        );

    line-height:1;

    font-weight:700;

    margin:0;

    letter-spacing:.3px;
}


.text-black{
    color:var(--negro);
}


.text-green{
    color:var(--verde);
}


/* =========================================================
   LOGO INFERIOR
========================================================= */

.logo-bottom{

    width:min(72vw,320px);

    height:auto;

    display:block;

    object-fit:contain;

    margin-top:5px;

    flex-shrink:0;
}


/* =========================================================
   POPUP
========================================================= */

.popup-overlay{

    position:fixed;

    inset:0;

    width:100%;

    height:100%;

    background:rgba(0,0,0,.78);

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    z-index:9999;
}


.popup-box{

    position:relative;

    width:min(90vw,450px);

    background:#ffffff;

    padding:35px 25px;

    border-radius:18px;

    text-align:center;

    box-shadow:
        0 20px 50px rgba(0,0,0,.45);

    animation:popupScale .3s ease;

    overflow:hidden;
}


@keyframes popupScale{

    from{

        transform:scale(.7);

        opacity:0;
    }

    to{

        transform:scale(1);

        opacity:1;
    }
}


/* =========================================================
   TEXTO POPUP
========================================================= */

.popup-label{

    font-family:'Oswald', sans-serif;

    font-size:20px;

    font-weight:600;

    color:#555555;

    letter-spacing:1px;

    margin:0 0 5px;
}


.popup-title{

    font-family:'Bebas Neue', sans-serif;

    font-size:
        clamp(
            42px,
            10vw,
            65px
        );

    line-height:.9;

    color: #171717;

    margin:0 0 15px;
}


/* =========================================================
   IMAGEN PREMIO
========================================================= */

.popup-image{

    width:min(70vw,300px);

    max-height:220px;

    object-fit:contain;

    display:block;

    margin:10px auto 20px;

    border-radius:10px;
}


/* =========================================================
   BOTÓN CERRAR
========================================================= */

.popup-btn{

    margin-top:20px;

    padding:12px 35px;

    border:none;

    border-radius:8px;

    background:var(--verde);

    color:#ffffff;

    font-family:'Oswald', sans-serif;

    font-size:20px;

    font-weight:600;

    cursor:pointer;

    box-shadow:
        0 5px 12px rgba(0,0,0,.20);

    transition:
        transform .2s ease,
        filter .2s ease,
        box-shadow .2s ease;
}


.popup-btn:hover{

    filter:brightness(.90);

    transform:scale(1.05);

    box-shadow:
        0 7px 16px rgba(0,0,0,.25);
}


.popup-btn:active{

    transform:scale(.96);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:600px){

    body{

        padding:
            18px
            12px
            22px;

        background-position:center center;

        background-size:cover;

        background-attachment:scroll;
    }


    .logo-top{

        width:65vw;

        max-width:260px;

        margin-bottom:12px;
    }


    .main-title{

        font-size:
            clamp(
                48px,
                12vw,
                68px
            );

        line-height:.87;

        margin-bottom:22px;
    }


    .wheel-container{

        width:84vw;
    }


    .pointer{

        top:-28px;

        border-left-width:20px;

        border-right-width:20px;

        border-top-width:43px;
    }


    .wheel-container::after{

        border-width:6px;
    }


    .center-button{

        width:19%;

        padding:6px;

        border-width:3px;
    }


    .bottom-text{

        margin-top:18px;

        margin-bottom:20px;
    }


    .bottom-text h2{

        font-size:
            clamp(
                23px,
                6vw,
                32px
            );
    }


    .logo-bottom{

        width:70vw;

        max-width:300px;
    }


    .popup-box{

        padding:
            30px
            18px;
    }


    .popup-image{

        max-height:180px;
    }
}


/* =========================================================
   PANTALLAS PEQUEÑAS
========================================================= */

@media(max-height:700px) and (max-width:600px){

    body{

        padding-top:10px;

        padding-bottom:12px;
    }


    .logo-top{

        width:52vw;

        margin-bottom:7px;
    }


    .main-title{

        font-size:44px;

        margin-bottom:14px;
    }


    .wheel-container{

        width:68vw;
    }


    .wheel-wrapper{

        margin-bottom:8px;
    }


    .bottom-text{

        margin-top:12px;

        margin-bottom:12px;
    }


    .logo-bottom{

        width:58vw;
    }
}

</style>

</head>


<body>


<img
    src="logo-superior.png"
    class="logo-top"
    alt="Santa Clara Pickup"
>


<h1 class="main-title">

    <span class="title-black">

    </span>

    <br>

    <span class="title-green">
        ACCESORIOS
    </span>

</h1>


<div class="wheel-wrapper">

    <div class="wheel-container">

        <div class="pointer"></div>

        <canvas id="wheel"></canvas>

        <div class="lights"></div>


        <div
            id="centerButton"
            class="center-button"
            onclick="spin()"
        >

            <img
                src="logo-centro.png"
                class="center-logo"
                alt="Santa Clara Pickup"
            >

        </div>

    </div>

</div>


<div class="bottom-text">

    <h2>

        <span class="text-black">
            ¡EQUIPA TU ISUZU
        </span>

        <span class="text-black">
            Y GANA!
        </span>

    </h2>

</div>


<img
    src="logo-inferior.png"
    class="logo-bottom"
    alt="Isuzu Pickup"
>


<script>


/* =========================================================
   PREMIOS
========================================================= */

const prizes = [

    {
        name:"POLERA ISUZU PICKUP",
        image:"premio1.png",
        message:"¡FELICITACIONES! GANASTE:"
    },

    {
        name:"INTENTA DE NUEVO",
        image:"intenta.png",
        message:"¡SIGUE PARTICIPANDO!"
    },

    {
        name:"POLO ISUZU PICKUP",
        image:"premio2.png",
        message:"¡FELICITACIONES! GANASTE:"
    },

    {
        name:"INTENTA DE NUEVO",
        image:"intenta.png",
        message:"¡SIGUE PARTICIPANDO!"
    },

    {
        name:"GORRA ISUZU PICKUP",
        image:"premio3.png",
        message:"¡FELICITACIONES! GANASTE:"
    },

    {
        name:"INTENTA DE NUEVO",
        image:"intenta.png",
        message:"¡SIGUE PARTICIPANDO!"
    },

    {
        name:"TERMOMETRO DIGITAL",
        image:"premio4.png",
        message:"¡FELICITACIONES! GANASTE:"
    },

    {
        name:"INTENTA DE NUEVO",
        image:"intenta.png",
        message:"¡SIGUE PARTICIPANDO!"
    }

];


/* =========================================================
   ELEMENTOS
========================================================= */

const canvas =
    document.getElementById("wheel");


const container =
    document.querySelector(".wheel-container");


const ctx =
    canvas.getContext("2d");


const centerButton =
    document.getElementById("centerButton");


/* =========================================================
   VARIABLES
========================================================= */

let angle = 0;

let spinning = false;


/* =========================================================
   SONIDOS
========================================================= */

const spinSound =
    new Audio("ruleta.mp3");


const winSound =
    new Audio("ganador.mp3");


const loseSound =
    new Audio("intenta.mp3");


/* =========================================================
   RESIZE CANVAS
========================================================= */

function resizeCanvas(){

    canvas.width =
        container.offsetWidth;

    canvas.height =
        container.offsetHeight;
}


/* =========================================================
   REGALO SIN DORADO
========================================================= */

function drawGiftIcon(
    ctx,
    x,
    y,
    size,
    boxColor,
    ribbonColor
){

    ctx.save();

    ctx.translate(x,y);


    const boxW =
        size * 0.60;

    const boxH =
        size * 0.43;

    const lidW =
        size * 0.70;

    const lidH =
        size * 0.13;

    const ribbonW =
        size * 0.10;

    const ribbonH =
        size * 0.075;

    const topY =
        -size * 0.015;


    /* =====================================================
       CAJA
    ===================================================== */

    ctx.fillStyle =
        boxColor;


    ctx.beginPath();


    ctx.roundRect(
        -boxW / 2,
        topY,
        boxW,
        boxH,
        size * 0.035
    );


    ctx.fill();


    /* =====================================================
       TAPA
    ===================================================== */

    ctx.beginPath();


    ctx.roundRect(
        -lidW / 2,
        topY - lidH,
        lidW,
        lidH,
        size * 0.03
    );


    ctx.fill();


    /* =====================================================
       CINTA VERTICAL
    ===================================================== */

    ctx.fillStyle =
        ribbonColor;


    ctx.fillRect(
        -ribbonW / 2,
        topY - lidH,
        ribbonW,
        boxH + lidH
    );


    /* =====================================================
       CINTA HORIZONTAL
    ===================================================== */

    ctx.fillRect(
        -boxW / 2,
        topY + boxH * 0.36,
        boxW,
        ribbonH
    );


    /* =====================================================
       LAZO
    ===================================================== */

    ctx.strokeStyle =
        ribbonColor;


    ctx.lineWidth =
        size * 0.055;


    ctx.lineCap =
        "round";


    ctx.lineJoin =
        "round";


    /* LAZO IZQUIERDO */

    ctx.beginPath();


    ctx.moveTo(
        0,
        topY - lidH
    );


    ctx.bezierCurveTo(

        -size * 0.05,
        -size * 0.29,

        -size * 0.28,
        -size * 0.31,

        -size * 0.21,
        -size * 0.105

    );


    ctx.bezierCurveTo(

        -size * 0.12,
        -size * 0.025,

        -size * 0.04,
        -size * 0.05,

        0,
        topY - lidH

    );


    ctx.stroke();


    /* LAZO DERECHO */

    ctx.beginPath();


    ctx.moveTo(
        0,
        topY - lidH
    );


    ctx.bezierCurveTo(

        size * 0.05,
        -size * 0.29,

        size * 0.28,
        -size * 0.31,

        size * 0.21,
        -size * 0.105

    );


    ctx.bezierCurveTo(

        size * 0.12,
        -size * 0.025,

        size * 0.04,
        -size * 0.05,

        0,
        topY - lidH

    );


    ctx.stroke();


    /* =====================================================
       NUDO CENTRAL
    ===================================================== */

    ctx.fillStyle =
        ribbonColor;


    ctx.beginPath();


    ctx.arc(
        0,
        topY - lidH,
        size * 0.055,
        0,
        Math.PI * 2
    );


    ctx.fill();


    /* =====================================================
       PUNTAS DEL LAZO
    ===================================================== */

    ctx.strokeStyle =
        ribbonColor;


    ctx.lineWidth =
        size * 0.045;


    ctx.beginPath();


    ctx.moveTo(

        -size * 0.03,

        topY -
        lidH +
        size * 0.035

    );


    ctx.quadraticCurveTo(

        -size * 0.09,

        topY +
        size * 0.02,

        -size * 0.13,

        topY +
        size * 0.08

    );


    ctx.stroke();


    ctx.beginPath();


    ctx.moveTo(

        size * 0.03,

        topY -
        lidH +
        size * 0.035

    );


    ctx.quadraticCurveTo(

        size * 0.09,

        topY +
        size * 0.02,

        size * 0.13,

        topY +
        size * 0.08

    );


    ctx.stroke();


    ctx.restore();
}


/* =========================================================
   DIBUJAR RULETA
========================================================= */

function drawWheel(){

    const size =
        canvas.width;


    const center =
        size / 2;


    const radius =
        center - 15;


    const sliceAngle =
        (2 * Math.PI) /
        prizes.length;


    ctx.clearRect(
        0,
        0,
        size,
        size
    );


    for(
        let i = 0;
        i < prizes.length;
        i++
    ){

        /* =================================================
           SEGMENTO
        ================================================= */

        ctx.beginPath();


        ctx.moveTo(
            center,
            center
        );


        ctx.arc(

            center,

            center,

            radius,

            angle +
            i * sliceAngle,

            angle +
            (i + 1) * sliceAngle

        );


        ctx.closePath();


        /* =================================================
           COLORES DE SEGMENTOS
        ================================================= */

        if(i % 3 === 0){

            ctx.fillStyle =
                "#E60012";

        }

        else if(i % 3 === 1){

            ctx.fillStyle =
                "#252525";

        }

        else{

            ctx.fillStyle =
                "#F4F4F4";

        }


        ctx.fill();


        ctx.lineWidth =
            3;


        ctx.strokeStyle =
            "#FFFFFF";


        ctx.stroke();


        /* =================================================
           CONTENIDO
        ================================================= */

        ctx.save();


        ctx.translate(
            center,
            center
        );


        ctx.rotate(

            angle +
            i * sliceAngle +
            sliceAngle / 2

        );


        /* =================================================
           INTENTA / DE NUEVO
        ================================================= */

        if(
            prizes[i].name ===
            "INTENTA DE NUEVO"
        ){

            if(i % 3 === 2){

                ctx.fillStyle =
                    "#171717";

            }

            else{

                ctx.fillStyle =
                    "#FFFFFF";

            }


            ctx.textAlign =
                "center";


            ctx.textBaseline =
                "middle";


            ctx.font =
                "700 " +
                (size * 0.042) +
                "px Oswald";


            const textX =
                radius * 0.67;


            const lineHeight =
                size * 0.052;


            ctx.fillText(

                "INTENTA",

                textX,

                -lineHeight / 2

            );


            ctx.fillText(

                "DE NUEVO",

                textX,

                lineHeight / 2

            );

        }

        else{

            /* =================================================
               REGALO
            ================================================= */

        let boxColor;
        let ribbonColor;


        /* =========================================================
        SEGMENTO NEGRO
        Caja blanca + cinta roja
        ========================================================= */

        if(i % 3 === 1){

        boxColor = "#FFFFFF";
        ribbonColor = "#E60012";

        }


        /* =========================================================
        SEGMENTO ROJO
        Caja blanca + cinta negra
        ========================================================= */

        else if(i % 3 === 0){

        boxColor = "#FFFFFF";
        ribbonColor = "#171717";

        }


        /* =========================================================
        SEGMENTO BLANCO
        Caja negra + cinta roja
        ========================================================= */

        else{

        boxColor = "#171717";
        ribbonColor = "#E60012";

        }

            drawGiftIcon(

                ctx,

                radius * 0.67,

                0,

                size * 0.17,

                boxColor,

                ribbonColor

            );

        }


        ctx.restore();

    }


    /* =====================================================
       BORDE
    ===================================================== */

    ctx.beginPath();


    ctx.arc(

        center,

        center,

        radius,

        0,

        2 * Math.PI

    );


    ctx.lineWidth =
        7;


    ctx.strokeStyle =
        "#171717";


    ctx.stroke();
}


/* =========================================================
   GIRAR
========================================================= */

function spin(){

    if(spinning)
        return;


    spinning =
        true;


    centerButton
        .classList
        .add("disabled");


    spinSound.currentTime =
        0;


    spinSound
        .play()
        .catch(() => {});


    const spinDuration =
        4000;


    const startAngle =
        angle;


    const extraSpins =
        6 * 2 * Math.PI;


    const randomAngle =
        Math.random() *
        2 *
        Math.PI;


    const finalAngle =
        startAngle +
        extraSpins +
        randomAngle;


    let start =
        null;


    function animate(timestamp){

        if(!start){

            start =
                timestamp;

        }


        const progress =
            timestamp -
            start;


        const normalized =
            Math.min(

                progress /
                spinDuration,

                1

            );


        const ease =
            1 -
            Math.pow(
                1 - normalized,
                3
            );


        angle =
            startAngle +
            ease *
            (
                finalAngle -
                startAngle
            );


        drawWheel();


        if(
            progress <
            spinDuration
        ){

            requestAnimationFrame(
                animate
            );

        }

        else{

            angle =
                finalAngle %
                (2 * Math.PI);


            drawWheel();


            spinning =
                false;


            centerButton
                .classList
                .remove(
                    "disabled"
                );


            spinSound.pause();


            showResult();

        }

    }


    requestAnimationFrame(
        animate
    );
}


/* =========================================================
   RESULTADO
========================================================= */

function showResult(){

    const sliceAngle =
        (2 * Math.PI) /
        prizes.length;


    const adjustedAngle =

        (
            angle +
            Math.PI / 2
        )
        %
        (2 * Math.PI);


    const index =

        prizes.length -

        Math.floor(

            adjustedAngle /
            sliceAngle

        ) -

        1;


    const finalIndex =

        (
            index +
            prizes.length
        )
        %
        prizes.length;


    const prize =
        prizes[finalIndex];


    if(
        prize.name ===
        "INTENTA DE NUEVO"
    ){

        loseSound.currentTime =
            0;


        loseSound
            .play()
            .catch(() => {});

    }

    else{

        winSound.currentTime =
            0;


        winSound
            .play()
            .catch(() => {});

    }


    showPopup(prize);
}


/* =========================================================
   POPUP
========================================================= */

function showPopup(prize){

    const popup =
        document.createElement(
            "div"
        );


    popup.className =
        "popup-overlay";


    popup.innerHTML = `

        <div class="popup-box">

            <p class="popup-label">

                ${prize.message}

            </p>


            <h2 class="popup-title">

                ${prize.name}

            </h2>


            <img
                src="${prize.image}"
                class="popup-image"
                alt="${prize.name}"
                onerror="
                    this.style.display='none';
                "
            >


            <button
                class="popup-btn"
                onclick="
                    this
                    .parentElement
                    .parentElement
                    .remove()
                "
            >

                CERRAR

            </button>

        </div>

    `;


    document.body.appendChild(
        popup
    );
}


/* =========================================================
   LUCES
========================================================= */

function createLights(){

    const lightsContainer =
        document.querySelector(
            ".lights"
        );


    lightsContainer.innerHTML =
        "";


    const size =
        container.offsetWidth;


    const center =
        size / 2;


    const radius =
        center * 0.97;


    const total =
        36;


    for(
        let i = 0;
        i < total;
        i++
    ){

        const lightAngle =

            (
                i / total
            )
            *
            (2 * Math.PI);


        const x =

            center +

            radius *
            Math.cos(
                lightAngle
            );


        const y =

            center +

            radius *
            Math.sin(
                lightAngle
            );


        const light =
            document.createElement(
                "div"
            );


        light
            .classList
            .add(
                "light"
            );


        light.style.left =

            (
                x /
                size *
                100
            )
            +
            "%";


        light.style.top =

            (
                y /
                size *
                100
            )
            +
            "%";


        light.style.animationDelay =

            (
                i * 0.05
            )
            +
            "s";


        lightsContainer
            .appendChild(
                light
            );

    }

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(

    "resize",

    () => {

        resizeCanvas();

        drawWheel();

        createLights();

    }

);


/* =========================================================
   CARGAR
========================================================= */

window.addEventListener(

    "load",

    () => {

        resizeCanvas();

        drawWheel();

        createLights();

    }

);

</script>
