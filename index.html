<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Ruleta de Accesorios - Santa Clara Pickup</title>

<link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

:root{
    --rojo:#E60012;
    --verde:#74B950;
    --negro:#171717;
    --blanco:#FFFFFF;
    --gris:#F4F4F4;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;
    min-height:100dvh;

    background-image:url("fondo.png");
    background-repeat:no-repeat;
    background-position:center center;
    background-size:cover;

    background-color:#f4f4f4;

    font-family:'Oswald',sans-serif;

    overflow-x:hidden;
}

.screen{
    width:100%;
    min-height:100vh;
    min-height:100dvh;
}


/* =========================================================
   PORTADA
========================================================= */

.cover-screen{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:flex-start;

    text-align:center;

    padding:
        clamp(18px,2.5vh,35px)
        12px
        clamp(25px,4vh,50px);
}


/* =========================================================
   BOTÓN MÚSICA
========================================================= */

.music-toggle{

    position:fixed;

    top:18px;

    right:18px;

    width:46px;

    height:46px;

    border:none;

    border-radius:50%;

    background:var(--verde);

    color:#ffffff;

    font-size:20px;

    cursor:pointer;

    z-index:100;

    display:flex;

    align-items:center;

    justify-content:center;

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.20);

    transition:
        transform .2s ease,
        filter .2s ease;
}

.music-toggle:hover{

    transform:scale(1.07);

    filter:brightness(.95);
}

.music-toggle:active{

    transform:scale(.95);
}


/* =========================================================
   LOGO SUPERIOR PORTADA
========================================================= */

.cover-logo-top{

    width:min(62vw,290px);

    height:auto;

    display:block;

    object-fit:contain;

    margin:
        0
        auto
        clamp(18px,2.5vh,28px);
}


/* =========================================================
   MEDIA RULETA PORTADA
========================================================= */

.cover-wheel-crop{

    position:relative;

    width:min(96vw,460px);

    height:
        clamp(
            150px,
            42vw,
            215px
        );

    margin:
        0
        auto
        clamp(10px,1.5vh,20px);

    overflow:hidden;
}

.cover-wheel-preview{

    position:absolute;

    left:50%;

    top:18px;

    transform:translateX(-50%);

    width:min(82vw,380px);

    aspect-ratio:1 / 1;

    border-radius:50%;

    filter:
        drop-shadow(
            0 7px 12px
            rgba(0,0,0,.25)
        );
}

.cover-wheel-preview::before{

    content:"";

    position:absolute;

    inset:-3.5%;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #303030 0%,
            #111111 35%,
            #252525 55%,
            #080808 80%,
            #292929 100%
        );

    z-index:-2;
}

.cover-wheel-preview::after{

    content:"";

    position:absolute;

    inset:1%;

    border-radius:50%;

    border:
        clamp(4px,.5vw,6px)
        solid
        var(--rojo);

    pointer-events:none;

    z-index:2;
}

#previewWheel{

    width:100%;

    height:100%;

    display:block;

    border-radius:50%;
}


/* =========================================================
   TÍTULO PORTADA
========================================================= */

.cover-title{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    font-family:'Bebas Neue',sans-serif;

    font-size:
        clamp(
            46px,
            min(10.5vw,6.8vh),
            82px
        );

    line-height:.84;

    letter-spacing:1px;

    margin:
        0
        0
        clamp(12px,1.8vh,22px);
}

.cover-title-black{
    color:var(--negro);
}

.cover-title-red{
    color:var(--rojo);
}


/* =========================================================
   INTRO
========================================================= */

.cover-intro{

    width:min(90vw,500px);

    margin:
        0
        auto
        clamp(18px,2.3vh,28px);

    font-size:
        clamp(
            16px,
            min(4vw,2.1vh),
            22px
        );

    line-height:1.3;

    font-weight:500;

    color:var(--negro);
}


/* =========================================================
   REQUISITOS
========================================================= */

.requirements-box{

    width:min(90vw,520px);

    background:rgba(255,255,255,.92);

    border-radius:18px;

    padding:
        clamp(
            18px,
            2.4vh,
            28px
        );

    margin-bottom:
        clamp(
            22px,
            3vh,
            35px
        );

    box-shadow:
        0 10px 28px
        rgba(0,0,0,.12);
}

.requirements-box h2{

    font-family:'Bebas Neue',sans-serif;

    font-size:
        clamp(
            28px,
            min(6vw,3.8vh),
            42px
        );

    color:var(--negro);

    margin:
        0
        0
        clamp(16px,2vh,22px);
}

.requirement-item{

    display:flex;

    align-items:center;

    gap:
        clamp(
            12px,
            2vw,
            18px
        );

    text-align:left;

    margin-bottom:
        clamp(
            13px,
            1.6vh,
            18px
        );
}

.requirement-item:last-child{
    margin-bottom:0;
}

.requirement-number{

    width:44px;

    height:44px;

    min-width:44px;

    border-radius:50%;

    background:var(--verde);

    color:#ffffff;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:'Bebas Neue',sans-serif;

    font-size:26px;
}

.requirement-item p{

    margin:0;

    font-size:
        clamp(
            15px,
            min(3.5vw,2vh),
            20px
        );

    line-height:1.25;

    color:var(--negro);
}


/* =========================================================
   BOTÓN PARTICIPAR
========================================================= */

.participate-btn{

    width:min(72vw,300px);

    padding:
        14px
        25px;

    border:none;

    border-radius:10px;

    background:var(--verde);

    color:#ffffff;

    font-family:'Oswald',sans-serif;

    font-size:
        clamp(
            21px,
            min(4.5vw,3vh),
            28px
        );

    font-weight:700;

    cursor:pointer;

    margin-bottom:
        clamp(
            26px,
            3.5vh,
            45px
        );

    box-shadow:
        0 6px 16px
        rgba(0,0,0,.22);

    transition:
        transform .2s ease,
        filter .2s ease;
}

.participate-btn:hover{

    transform:scale(1.05);

    filter:brightness(.93);
}

.participate-btn:active{

    transform:scale(.96);
}


/* =========================================================
   LOGO INFERIOR PORTADA
========================================================= */

.cover-logo-bottom{

    width:min(66vw,320px);

    height:auto;

    display:block;

    object-fit:contain;
}


/* =========================================================
   PANTALLA RULETA
========================================================= */

#wheelScreen{

    display:none;

    flex-direction:column;

    align-items:center;

    min-height:100vh;
    min-height:100dvh;

    padding:
        clamp(10px,1.5vh,22px)
        12px
        clamp(20px,3vh,40px);
}

.logo-top{

    width:min(62vw,280px);

    height:auto;

    display:block;

    object-fit:contain;

    margin:
        0
        auto
        clamp(20px,3vh,45px);
}

.main-title{

    font-family:'Bebas Neue',sans-serif;

    font-size:
        clamp(
            46px,
            min(10vw,7vh),
            82px
        );

    line-height:.86;

    text-align:center;

    letter-spacing:1px;

    font-weight:400;

    margin:
        0
        0
        clamp(26px,3vh,45px);
}

.title-black{
    color:var(--negro);
}

.title-red{
    color:var(--rojo);
}


/* =========================================================
   RULETA
========================================================= */

.wheel-wrapper{

    width:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    margin:
        clamp(5px,.8vh,15px)
        auto
        clamp(28px,3vh,48px);
}

.wheel-container{

    position:relative;

    width:
        min(
            82vw,
            45vh,
            520px
        );

    aspect-ratio:1 / 1;

    border-radius:50%;

    overflow:visible;
}

.wheel-container::before{

    content:"";

    position:absolute;

    inset:-3%;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #303030 0%,
            #111111 35%,
            #252525 55%,
            #080808 80%,
            #292929 100%
        );

    z-index:-2;
}

.wheel-container::after{

    content:"";

    position:absolute;

    inset:1%;

    border-radius:50%;

    border:
        clamp(5px,.7vw,9px)
        solid
        var(--rojo);

    pointer-events:none;

    z-index:2;
}

canvas{

    width:100%;

    height:100%;

    display:block;

    border-radius:50%;
}


/* =========================================================
   FLECHA
========================================================= */

.pointer{

    position:absolute;

    top:
        clamp(
            -48px,
            -3.2vh,
            -27px
        );

    left:50%;

    transform:translateX(-50%);

    width:0;

    height:0;

    border-left:
        clamp(18px,2.4vw,30px)
        solid transparent;

    border-right:
        clamp(18px,2.4vw,30px)
        solid transparent;

    border-top:
        clamp(38px,4.2vw,58px)
        solid
        var(--negro);

    z-index:30;
}


/* =========================================================
   LUCES
========================================================= */

.lights{

    position:absolute;

    inset:0;

    border-radius:50%;

    pointer-events:none;

    z-index:5;
}

.light{

    position:absolute;

    width:2.4%;

    aspect-ratio:1 / 1;

    background:#ffffff;

    border-radius:50%;

    box-shadow:
        0 0 6px #ffffff,
        0 0 12px #ffffff,
        0 0 18px #ff2020;

    animation:
        blink 1s infinite alternate;
}

@keyframes blink{

    from{

        opacity:.45;

        transform:
            translate(-50%,-50%)
            scale(.85);
    }

    to{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1);
    }
}


/* =========================================================
   BOTÓN CENTRAL
========================================================= */

.center-button{

    position:absolute;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    width:18%;

    aspect-ratio:1 / 1;

    border-radius:50%;

    border:
        clamp(3px,.4vw,5px)
        solid
        var(--verde);

    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #f4f4f4 68%,
            #d6d6d6 100%
        );

    display:flex;

    align-items:center;

    justify-content:center;

    padding:
        clamp(5px,.8vw,10px);

    cursor:pointer;

    z-index:20;

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.center-button:hover{

    transform:
        translate(-50%,-50%)
        scale(1.11);

    box-shadow:
        0 0 18px
        rgba(116,185,80,.55);
}

.center-button:active{

    transform:
        translate(-50%,-50%)
        scale(.94);
}

.center-button.disabled{

    pointer-events:none;

    opacity:.9;
}

.center-logo{

    width:78%;

    height:78%;

    object-fit:contain;

    display:block;

    pointer-events:none;
}


/* =========================================================
   TEXTO INFERIOR
========================================================= */

.bottom-text{

    width:100%;

    text-align:center;

    margin:
        clamp(25px,3vh,45px)
        0
        clamp(35px,4vh,65px);
}

.bottom-text h2{

    font-size:
        clamp(
            22px,
            min(5.5vw,3.5vh),
            36px
        );

    line-height:1;

    font-weight:700;

    margin:0;

    color:var(--negro);
}

.logo-bottom{

    width:min(68vw,330px);

    max-height:10vh;

    height:auto;

    display:block;

    object-fit:contain;
}


/* =========================================================
   POPUP
========================================================= */

.popup-overlay{

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.78);

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    z-index:9999;
}

.popup-box{

    width:min(90vw,500px);

    background:#ffffff;

    padding:
        clamp(25px,3vh,40px)
        clamp(20px,4vw,32px);

    border-radius:18px;

    text-align:center;
}

.popup-label{

    font-size:
        clamp(
            17px,
            3vw,
            22px
        );

    color:#555555;

    margin:0 0 5px;
}

.popup-title{

    font-family:'Bebas Neue',sans-serif;

    font-size:
        clamp(
            42px,
            10vw,
            70px
        );

    color:var(--rojo);

    margin:
        0
        0
        18px;
}

.popup-image{

    width:min(70vw,320px);

    max-height:30vh;

    object-fit:contain;

    display:block;

    margin:
        10px
        auto
        20px;
}

.popup-btn{

    margin-top:16px;

    padding:
        12px
        35px;

    border:none;

    border-radius:9px;

    background:var(--verde);

    color:#ffffff;

    font-family:'Oswald',sans-serif;

    font-size:20px;

    font-weight:600;

    cursor:pointer;
}


/* =========================================================
   MÓVIL
========================================================= */

@media(max-width:600px){

    .cover-wheel-crop{

        width:98vw;

        height:
            clamp(
                145px,
                44vw,
                185px
            );
    }

    .cover-wheel-preview{

        width:min(84vw,340px);

        top:16px;
    }

    .wheel-container{

        width:
            min(
                84vw,
                44vh,
                460px
            );
    }
}

</style>

</head>


<body>

     AUDIO DE FONDO
========================================================= -->

<audio

<!-- =========================================================

<div

<script>


/* =========================================================
   PREMIOS
========================================================= */

const prizes = [

    {
        name:"POLERA ISUZU PICKUP",
        image:"premio1.png",
        message:"¡FELICITACIONES! GANASTE:"
    },

    {
        name:"INTENTA DE NUEVO",
        image:"intenta.png",
        message:"¡SIGUE PARTICIPANDO!"
    },

    {
        name:"POLO ISUZU PICKUP",
        image:"premio2.png",
        message:"¡FELICITACIONES! GANASTE:"
    },

    {
        name:"INTENTA DE NUEVO",
        image:"intenta.png",
        message:"¡SIGUE PARTICIPANDO!"
    },

    {
        name:"GORRA ISUZU PICKUP",
        image:"premio3.png",
        message:"¡FELICITACIONES! GANASTE:"
    },

    {
        name:"INTENTA DE NUEVO",
        image:"intenta.png",
        message:"¡SIGUE PARTICIPANDO!"
    },

    {
        name:"TERMOMETRO DIGITAL",
        image:"premio4.png",
        message:"¡FELICITACIONES! GANASTE:"
    },

    {
        name:"INTENTA DE NUEVO",
        image:"intenta.png",
        message:"¡SIGUE PARTICIPANDO!"
    }

];


/* =========================================================
   ELEMENTOS
========================================================= */

const canvas =
    document.getElementById("wheel");

const ctx =
    canvas.getContext("2d");

const container =
    document.querySelector(".wheel-container");

const centerButton =
    document.getElementById("centerButton");

const previewCanvas =
    document.getElementById("previewWheel");

const previewCtx =
    previewCanvas.getContext("2d");

const backgroundMusic =
    document.getElementById("backgroundMusic");

const musicToggle =
    document.getElementById("musicToggle");


/* =========================================================
   VARIABLES
========================================================= */

let angle = 0;

let spinning = false;

let musicEnabled = false;


/* =========================================================
   SONIDOS
========================================================= */

const spinSound =
    new Audio("ruleta.mp3");

const winSound =
    new Audio("ganador.mp3");

const loseSound =
    new Audio("intenta.mp3");


/* =========================================================
   MÚSICA PORTADA
========================================================= */

backgroundMusic.volume = 0.25;


function playBackgroundMusic(){

    backgroundMusic
        .play()
        .then(() => {

            musicEnabled = true;

            musicToggle.textContent = "🔊";

        })
        .catch(() => {

            musicEnabled = false;

            musicToggle.textContent = "🔇";

        });

}


function pauseBackgroundMusic(){

    backgroundMusic.pause();

    musicEnabled = false;

    musicToggle.textContent = "🔇";

}


function toggleMusic(){

    if(backgroundMusic.paused){

        playBackgroundMusic();

    }

    else{

        pauseBackgroundMusic();

    }

}


/* =========================================================
   PASAR A RULETA
========================================================= */

function showWheelScreen(){

    /*
       DETENER MÚSICA DE PORTADA
    */

    backgroundMusic.pause();

    backgroundMusic.currentTime = 0;


    document
        .getElementById("coverScreen")
        .style.display =
        "none";


    document
        .getElementById("wheelScreen")
        .style.display =
        "flex";


    window.scrollTo(
        0,
        0
    );


    setTimeout(
        updateLayout,
        100
    );
}


/* =========================================================
   CANVAS
========================================================= */

function resizeCanvas(){

    const size =
        container.offsetWidth;


    if(size <= 0)
        return;


    const ratio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        size * ratio;


    canvas.height =
        size * ratio;


    canvas.style.width =
        size + "px";


    canvas.style.height =
        size + "px";


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );
}


/* =========================================================
   REGALO
========================================================= */

function drawGiftIcon(
    context,
    x,
    y,
    size,
    boxColor,
    ribbonColor
){

    context.save();

    context.translate(x,y);


    const boxW = size * .60;
    const boxH = size * .43;

    const lidW = size * .70;
    const lidH = size * .13;

    const ribbonW = size * .10;
    const ribbonH = size * .075;

    const topY = -size * .015;


    context.fillStyle =
        boxColor;


    context.beginPath();

    context.roundRect(
        -boxW / 2,
        topY,
        boxW,
        boxH,
        size * .035
    );

    context.fill();


    context.beginPath();

    context.roundRect(
        -lidW / 2,
        topY - lidH,
        lidW,
        lidH,
        size * .03
    );

    context.fill();


    context.fillStyle =
        ribbonColor;


    context.fillRect(
        -ribbonW / 2,
        topY - lidH,
        ribbonW,
        boxH + lidH
    );


    context.fillRect(
        -boxW / 2,
        topY + boxH * .36,
        boxW,
        ribbonH
    );


    context.strokeStyle =
        ribbonColor;


    context.lineWidth =
        size * .055;


    context.lineCap =
        "round";


    context.beginPath();

    context.moveTo(
        0,
        topY - lidH
    );


    context.bezierCurveTo(
        -size * .05,
        -size * .29,
        -size * .28,
        -size * .31,
        -size * .21,
        -size * .105
    );


    context.bezierCurveTo(
        -size * .12,
        -size * .025,
        -size * .04,
        -size * .05,
        0,
        topY - lidH
    );


    context.stroke();


    context.beginPath();

    context.moveTo(
        0,
        topY - lidH
    );


    context.bezierCurveTo(
        size * .05,
        -size * .29,
        size * .28,
        -size * .31,
        size * .21,
        -size * .105
    );


    context.bezierCurveTo(
        size * .12,
        -size * .025,
        size * .04,
        -size * .05,
        0,
        topY - lidH
    );


    context.stroke();


    context.fillStyle =
        ribbonColor;


    context.beginPath();

    context.arc(
        0,
        topY - lidH,
        size * .055,
        0,
        Math.PI * 2
    );

    context.fill();


    context.restore();
}


/* =========================================================
   DIBUJAR RULETA GENÉRICA
========================================================= */

function drawWheelOnCanvas(
    context,
    size,
    wheelAngle
){

    const center =
        size / 2;


    const radius =
        center - size * .03;


    const sliceAngle =
        (2 * Math.PI) /
        prizes.length;


    context.clearRect(
        0,
        0,
        size,
        size
    );


    for(
        let i = 0;
        i < prizes.length;
        i++
    ){

        context.beginPath();

        context.moveTo(
            center,
            center
        );


        context.arc(
            center,
            center,
            radius,
            wheelAngle + i * sliceAngle,
            wheelAngle + (i + 1) * sliceAngle
        );


        context.closePath();


        if(i % 3 === 0){

            context.fillStyle =
                "#E60012";

        }

        else if(i % 3 === 1){

            context.fillStyle =
                "#252525";

        }

        else{

            context.fillStyle =
                "#F4F4F4";

        }


        context.fill();


        context.lineWidth =
            Math.max(
                2,
                size * .006
            );


        context.strokeStyle =
            "#FFFFFF";


        context.stroke();


        context.save();


        context.translate(
            center,
            center
        );


        context.rotate(
            wheelAngle +
            i * sliceAngle +
            sliceAngle / 2
        );


        if(
            prizes[i].name ===
            "INTENTA DE NUEVO"
        ){

            context.fillStyle =
                i % 3 === 2
                ? "#171717"
                : "#FFFFFF";


            context.textAlign =
                "center";


            context.textBaseline =
                "middle";


            context.font =
                "700 " +
                (size * .042) +
                "px Oswald";


            const textX =
                radius * .67;


            const lineHeight =
                size * .052;


            context.fillText(
                "INTENTA",
                textX,
                -lineHeight / 2
            );


            context.fillText(
                "DE NUEVO",
                textX,
                lineHeight / 2
            );

        }

        else{

            let boxColor;
            let ribbonColor;


            if(i % 3 === 1){

                boxColor =
                    "#FFFFFF";

                ribbonColor =
                    "#E60012";

            }

            else if(i % 3 === 0){

                boxColor =
                    "#FFFFFF";

                ribbonColor =
                    "#171717";

            }

            else{

                boxColor =
                    "#171717";

                ribbonColor =
                    "#E60012";

            }


            drawGiftIcon(
                context,
                radius * .67,
                0,
                size * .17,
                boxColor,
                ribbonColor
            );

        }


        context.restore();

    }


    context.beginPath();


    context.arc(
        center,
        center,
        radius,
        0,
        Math.PI * 2
    );


    context.lineWidth =
        Math.max(
            5,
            size * .014
        );


    context.strokeStyle =
        "#171717";


    context.stroke();
}


/* =========================================================
   RULETA PRINCIPAL
========================================================= */

function drawWheel(){

    const size =
        container.offsetWidth;


    if(size <= 0)
        return;


    drawWheelOnCanvas(
        ctx,
        size,
        angle
    );
}


/* =========================================================
   PREVIEW PORTADA
========================================================= */

function drawPreviewWheel(){

    const previewContainer =
        document.querySelector(
            ".cover-wheel-preview"
        );


    const size =
        previewContainer.offsetWidth;


    if(size <= 0)
        return;


    const ratio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    previewCanvas.width =
        size * ratio;


    previewCanvas.height =
        size * ratio;


    previewCanvas.style.width =
        size + "px";


    previewCanvas.style.height =
        size + "px";


    previewCtx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    drawWheelOnCanvas(
        previewCtx,
        size,
        0
    );


    const center =
        size / 2;


    previewCtx.beginPath();


    previewCtx.arc(
        center,
        center,
        size * .09,
        0,
        Math.PI * 2
    );


    previewCtx.fillStyle =
        "#FFFFFF";


    previewCtx.fill();


    previewCtx.lineWidth =
        Math.max(
            3,
            size * .012
        );


    previewCtx.strokeStyle =
        "#74B950";


    previewCtx.stroke();
}


/* =========================================================
   GIRAR
========================================================= */

function spin(){

    if(spinning)
        return;


    spinning = true;


    centerButton
        .classList
        .add("disabled");


    spinSound.currentTime = 0;

    spinSound
        .play()
        .catch(() => {});


    const spinDuration =
        4000;


    const startAngle =
        angle;


    const finalAngle =
        startAngle +
        6 * 2 * Math.PI +
        Math.random() * 2 * Math.PI;


    let start = null;


    function animate(timestamp){

        if(!start){

            start = timestamp;

        }


        const progress =
            timestamp - start;


        const normalized =
            Math.min(
                progress / spinDuration,
                1
            );


        const ease =
            1 -
            Math.pow(
                1 - normalized,
                3
            );


        angle =
            startAngle +
            ease *
            (
                finalAngle -
                startAngle
            );


        drawWheel();


        if(progress < spinDuration){

            requestAnimationFrame(
                animate
            );

        }

        else{

            angle =
                finalAngle %
                (2 * Math.PI);


            drawWheel();


            spinning = false;


            centerButton
                .classList
                .remove("disabled");


            spinSound.pause();


            showResult();
        }
    }


    requestAnimationFrame(
        animate
    );
}


/* =========================================================
   RESULTADO
========================================================= */

function showResult(){

    const sliceAngle =
        (2 * Math.PI) /
        prizes.length;


    const adjustedAngle =
        (
            angle +
            Math.PI / 2
        )
        %
        (2 * Math.PI);


    const index =
        prizes.length -
        Math.floor(
            adjustedAngle /
            sliceAngle
        )
        -
        1;


    const finalIndex =
        (
            index +
            prizes.length
        )
        %
        prizes.length;


    const prize =
        prizes[finalIndex];


    if(
        prize.name ===
        "INTENTA DE NUEVO"
    ){

        loseSound.currentTime = 0;

        loseSound
            .play()
            .catch(() => {});

    }

    else{

        winSound.currentTime = 0;

        winSound
            .play()
            .catch(() => {});

    }


    showPopup(prize);
}


/* =========================================================
   POPUP
========================================================= */

function showPopup(prize){

    const popup =
        document.createElement(
            "div"
        );


    popup.className =
        "popup-overlay";


    popup.innerHTML = `

        <div class="popup-box">

            <p class="popup-label">
                ${prize.message}
            </p>

            <h2 class="popup-title">
                ${prize.name}
            </h2>

            <img
                src="${prize.image}"
                class="popup-image"
                alt="${prize.name}"
                onerror="
                    this.style.display='none';
                "
            >

            <button
                class="popup-btn"
                onclick="
                    this
                    .parentElement
                    .parentElement
                    .remove()
                "
            >
                CERRAR
            </button>

        </div>

    `;


    document.body
        .appendChild(
            popup
        );
}


/* =========================================================
   LUCES
========================================================= */

function createLights(){

    const lightsContainer =
        document.querySelector(
            ".lights"
        );


    lightsContainer.innerHTML = "";


    const size =
        container.offsetWidth;


    if(size <= 0)
        return;


    const center =
        size / 2;


    const radius =
        center * .97;


    const total =
        36;


    for(
        let i = 0;
        i < total;
        i++
    ){

        const lightAngle =
            (
                i /
                total
            )
            *
            2 *
            Math.PI;


        const x =
            center +
            radius *
            Math.cos(
                lightAngle
            );


        const y =
            center +
            radius *
            Math.sin(
                lightAngle
            );


        const light =
            document.createElement(
                "div"
            );


        light.classList.add(
            "light"
        );


        light.style.left =
            (
                x /
                size *
                100
            )
            +
            "%";


        light.style.top =
            (
                y /
                size *
                100
            )
            +
            "%";


        light.style.animationDelay =
            (
                i * .05
            )
            +
            "s";


        lightsContainer
            .appendChild(
                light
            );
    }
}


/* =========================================================
   RESPONSIVE
========================================================= */

let resizeTimer;


function updateLayout(){

    const wheelScreen =
        document.getElementById(
            "wheelScreen"
        );


    if(
        wheelScreen.style.display ===
        "flex"
    ){

        resizeCanvas();

        drawWheel();

        createLights();
    }


    const cover =
        document.getElementById(
            "coverScreen"
        );


    if(
        cover.style.display !==
        "none"
    ){

        drawPreviewWheel();
    }
}


window.addEventListener(
    "resize",
    () => {

        clearTimeout(
            resizeTimer
        );


        resizeTimer =
            setTimeout(
                updateLayout,
                120
            );
    }
);


/* =========================================================
   CARGA
========================================================= */

window.addEventListener(
    "load",
    () => {

        document
            .getElementById(
                "coverScreen"
            )
            .style.display =
            "flex";


        document
            .getElementById(
                "wheelScreen"
            )
            .style.display =
            "none";


        if(document.fonts){

            document.fonts.ready.then(
                () => {

                    drawPreviewWheel();

                }
            );

        }

        else{

            drawPreviewWheel();
        }


        /*
           INTENTAR AUTOPLAY.

           Si el navegador lo bloquea,
           el botón 🔊 permite iniciarlo.
        */

        playBackgroundMusic();
    }
);

</script>
